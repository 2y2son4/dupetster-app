<app-toast-layer [toasts]="state.toasts" (dismiss)="state.dismissToast($event)"></app-toast-layer>

<app-loader-overlay [isBusy]="state.isBusy()" [busyMessage]="state.busyMessage()"
  (dismiss)="state.dismissLoader()"></app-loader-overlay>

<app-confirm-modal [visible]="!!state.cardPendingDelete" title="Delete card"
  message="Are you sure you want to remove this card?" confirmLabel="Delete" (cancel)="state.cancelDelete()"
  (confirm)="state.confirmDelete()"></app-confirm-modal>

<header class="hero">
  <h1>Dupetster</h1>
  <p>Create your timeline music cards</p>
</header>

<main class="page">

    <app-card-form-panel [form]="state.form" [editingCardId]="state.editingCardId" [difficulties]="state.difficulties"
      [qrModes]="state.qrModes" [qrMode]="state.qrMode"
      [detectedTrackId]="state.getDetectedTrackId(state.form.spotifyUrl)"
      [spotifyAutofillLoading]="state.spotifyAutofillLoading()" (formChange)="state.onFormChange($event)"
      (qrModeChange)="state.qrMode = $event" (save)="state.saveOrUpdateCard()"
      (clear)="state.resetForm()" />

    <app-live-preview-panel [form]="state.form" [revealYear]="state.revealYear" [previewQr]="state.previewQr()"
      (revealYearChange)="state.onRevealYearChange($event)" />
  </section>

  <app-cards-section [filteredCards]="state.filteredCards" [pagedCards]="state.pagedCards"
    [selectedCardIds]="state.selectedCardIds" [difficulties]="state.difficulties" [searchQuery]="state.searchQuery"
    [difficultyFilter]="state.difficultyFilter" [sortMode]="state.sortMode" [selectedCount]="state.selectedCount"
    [allFilteredSelected]="state.allFilteredSelected" [cardsCount]="state.cards.length"
    [pdfLoading]="state.pdfLoading()" [revealYear]="state.revealYear" [totalPages]="state.totalPages"
    [currentPage]="state.currentPage" [qrModeLabel]="state.getQrModeLabel(state.qrMode)"
    (searchQueryChange)="state.onSearchQueryChange($event)"
    (difficultyFilterChange)="state.onDifficultyFilterChange($event)" (sortModeChange)="state.onSortModeChange($event)"
    (toggleSelectAllFiltered)="state.toggleSelectAllFiltered()" (deleteSelected)="state.deleteSelectedCards()"
    (exportPdf)="state.exportPdf()"
    (exportJson)="state.exportJson()" (exportCsv)="state.exportCsv()" (regenerateQr)="state.regenerateQrForAllCards()"
    (importJson)="state.onImportJson($event)" (importCsv)="state.onImportCsv($event)"
    (toggleSelect)="state.toggleSelect($event)" (editCard)="state.editCard($event)"
    (duplicateCard)="state.duplicateCard($event)" (deleteCard)="state.askDelete($event)"
    (previousPage)="state.previousPage()" (nextPage)="state.nextPage()" />
