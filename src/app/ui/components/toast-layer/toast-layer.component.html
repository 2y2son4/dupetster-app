<div class="toast-layer">
  @for (t of toasts(); track t.id) {
    <div class="toast" [class]="'toast ' + t.type">
      <div class="toast-body">
        <span>{{ t.text }}</span>
        <button class="toast-close" type="button" (click)="dismiss.emit(t.id)" aria-label="Dismiss notification">
          x
        </button>
      </div>
    </div>
  }
</div>
