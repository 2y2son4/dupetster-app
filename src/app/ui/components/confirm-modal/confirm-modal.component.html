<div class="modal" *ngIf="visible">
  <div class="modal-content">
    <h3>{{ title }}</h3>
    <p>{{ message }}</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" (click)="cancel.emit()">Cancel</button>
      <button class="btn btn-danger" (click)="confirm.emit()">{{ confirmLabel }}</button>
    </div>
  </div>
</div>
